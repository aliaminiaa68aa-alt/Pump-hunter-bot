name: High timeframe 4H and 1D scanner

on:
  push:
    branches: [main]
    paths:
      - "high_timeframe_bot.py"
      - ".github/workflows/high-timeframe.yml"
      - "tests/test_high_timeframe_bot.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: high-timeframe-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Restore sent-signal history
        uses: actions/cache@v4
        with:
          path: .state/high_tf_sent.json
          key: high-tf-state-v2-${{ github.run_id }}
          restore-keys: |
            high-tf-state-v2-

      - name: Compile scanner and tests
        run: |
          python -m py_compile high_timeframe_bot.py
          python -m unittest discover -s tests -p 'test_high_timeframe_bot.py' -v

      - name: Run independent 4H and daily scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          HIGH_TF_MAX_SYMBOLS: "100"
          HIGH_TF_STATE_PATH: ".state/high_tf_sent.json"
        run: python -c "from high_timeframe_bot import run_once; print(run_once())"
