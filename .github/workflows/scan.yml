name: OI Channel Signal Scanner

on:
  push:
    branches: [main]
  # Scan @oi_detector alerts first, then rotate through the wider crypto perpetual universe.
  workflow_dispatch:
  schedule:
    # Avoid GitHub's busiest top-of-hour scheduling window.
    - cron: "2-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: pump-hunter-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: .oi_state
          key: oi-channel-state-${{ github.run_id }}
          restore-keys: |
            oi-channel-state-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile-check channel signal engine
        run: python -m compileall -q oi_engine
      - name: Poll OI channel and confirm actionable signals
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
        # GitHub scheduled workflows have a 5-minute minimum cadence.
        # Keep this runner alive and repeat scans on an approximately 60-second
        # cadence within each scheduled window, reusing the same on-disk state.
        run: |
          timeout 220s bash -c '
            deadline=$((SECONDS + 205))
            while (( SECONDS < deadline )); do
              cycle_start=$SECONDS
              python -m oi_engine.telegram_runner
              elapsed=$((SECONDS - cycle_start))
              wait_seconds=$((60 - elapsed))
              if (( wait_seconds > 0 )); then
                sleep "$wait_seconds"
              fi
            done
          '
      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .oi_state
          key: oi-channel-state-${{ github.run_id }}
