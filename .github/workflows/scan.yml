name: Pump Hunter Cloud Scanner

"on":
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [scheduled-scan]
  push:
    branches: [main]
    paths:
      - ".github/workflows/scan.yml"
      - "oi_engine/**"
      - "Bot.py"
      - "tests/**"
      - "requirements.txt"

concurrency:
  group: pump-hunter-scheduled-scanner
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Run crypto signal scanner
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: .oi_state
          key: pump-hunter-state-${{ github.run_id }}
          restore-keys: |
            pump-hunter-state-

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Diagnose exchange network access
        run: |
          python - <<'PY'
          import json
          import requests

          session = requests.Session()
          session.headers.update({"User-Agent": "Pump-Hunter-Network-Diagnostic/1.0"})
          try:
              ip = session.get("https://api.ipify.org", timeout=10).text.strip()
              print(f"RUNNER_EGRESS_IP={ip}")
              try:
                  geo = session.get(f"https://ipapi.co/{ip}/json/", timeout=10).json()
                  print("RUNNER_EGRESS_GEO=" + json.dumps({
                      key: geo.get(key) for key in ("ip", "country_name", "country_code", "region", "city", "org")
                  }, ensure_ascii=False))
              except Exception as exc:
                  print(f"IP_GEO_LOOKUP_ERROR={type(exc).__name__}: {exc}")
          except Exception as exc:
              print(f"EGRESS_IP_LOOKUP_ERROR={type(exc).__name__}: {exc}")

          checks = {
              "BINANCE_USDM_TIME": "https://fapi.binance.com/fapi/v1/time",
              "BINANCE_USDM_PING": "https://fapi.binance.com/fapi/v1/ping",
              "BINANCE_SPOT_TIME": "https://api.binance.com/api/v3/time",
              "BINANCE_PUBLIC_DATA_TIME": "https://data-api.binance.vision/api/v3/time",
              "BYBIT_PUBLIC_TIME": "https://api.bybit.com/v5/market/time",
          }
          for name, url in checks.items():
              try:
                  response = session.get(url, timeout=12)
                  print(f"{name}: status={response.status_code} server={response.headers.get('server')} via={response.headers.get('via')}")
                  print(f"{name}_BODY={response.text[:500]!r}")
              except Exception as exc:
                  print(f"{name}_ERROR={type(exc).__name__}: {exc}")
          PY

      - name: Compile-check all strategy code
        run: python -m compileall -q Bot.py oi_engine

      - name: Run strategy regression tests
        timeout-minutes: 2
        run: python -m unittest discover -s tests -v

      - name: Run scanner with live entry monitoring
        timeout-minutes: 4
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          SIGNAL_SCAN_INTERVAL_SECONDS: "300"
          LIVE_MONITOR_INTERVAL_SECONDS: "5"
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 20500s python -m oi_engine.service
          status=$?
          if [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          echo "Scheduled live-monitor window ended normally after 20,500 seconds (~5h42m)."

      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .oi_state
          key: pump-hunter-state-${{ github.run_id }}
