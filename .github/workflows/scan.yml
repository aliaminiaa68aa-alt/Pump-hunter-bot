name: OI Channel Signal Scanner

on:
  # Manual runs only; Termux is the active scanner.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pump-hunter-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: .oi_state
          key: oi-channel-state-${{ github.run_id }}
        restore-keys: |
          oi-channel-state-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile-check channel signal engine
        run: python -m compileall -q oi_engine
      - name: Poll OI channel and confirm actionable signals
        timeout-minutes: 4
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
        run: timeout 210s python -m oi_engine.telegram_runner
      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .oi_state
          key: oi-channel-state-${{ github.run_id }}
