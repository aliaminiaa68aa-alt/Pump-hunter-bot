name: Pump Hunter Cloud Scanner

"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scan.yml"
      - "oi_engine/**"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: pump-hunter-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Run crypto signal scanner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: .oi_state
          key: pump-hunter-state-${{ github.run_id }}
          restore-keys: |
            pump-hunter-state-

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile-check signal engine
        run: python -m compileall -q oi_engine

      - name: Run one cloud scan and verify Telegram configuration
        timeout-minutes: 4
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
        run: timeout 210s python -m oi_engine.telegram_runner

      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .oi_state
          key: pump-hunter-state-${{ github.run_id }}
