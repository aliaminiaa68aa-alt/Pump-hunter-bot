name: Pump Hunter

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    concurrency:
      group: pump-hunter-scan
      cancel-in-progress: true
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: .bot_state
          key: pump-hunter-state-${{ github.run_id }}
          restore-keys: |
            pump-hunter-state-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run bot scan
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: timeout 240s python Bot.py
      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bot_state
          key: pump-hunter-state-${{ github.run_id }}
