name: Pump Hunter Cloud Scanner

"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [scheduled-scan]
  push:
    branches: [main]
    paths:
      - ".github/workflows/scan.yml"
      - "oi_engine/**"
      - "Bot.py"
      - "tests/**"
      - "requirements.txt"

concurrency:
  group: pump-hunter-scheduled-scanner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    name: Run crypto signal scanner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: .oi_state
          key: pump-hunter-state-${{ github.run_id }}
          restore-keys: |
            pump-hunter-state-

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile-check all strategy code
        run: python -m compileall -q Bot.py oi_engine

      - name: Run strategy regression tests
        timeout-minutes: 2
        run: python -m unittest discover -s tests -v

      - name: Run scanner with live entry monitoring
        timeout-minutes: 4
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          SIGNAL_SCAN_INTERVAL_SECONDS: "300"
          LIVE_MONITOR_INTERVAL_SECONDS: "5"
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 225s python -m oi_engine.service
          status=$?
          if [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          echo "Scheduled live-monitor window ended normally after 225 seconds."

      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .oi_state
          key: pump-hunter-state-${{ github.run_id }}
