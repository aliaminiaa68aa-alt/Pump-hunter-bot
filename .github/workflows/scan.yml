name: Pump Hunter

on:
workflow_dispatch:
schedule:
- cron: "*/5 * * * *"

jobs:
scan:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - run: pip install -r requirements.txt

  - name: Run bot scan
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    run: timeout 240s python bot.py
