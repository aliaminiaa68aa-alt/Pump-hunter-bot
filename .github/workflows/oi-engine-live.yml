name: OI signal scanner

on:
  schedule:
    # Offset away from common hour-boundary load; still every five minutes.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: oi-signal-scanner
  cancel-in-progress: false

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore signal deduplication state
        uses: actions/cache/restore@v4
        with:
          path: .oi_state
          key: oi-public-only-v2-${{ github.run_id }}
          restore-keys: |
            oi-public-only-v2-
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Ingest only public @oi_detector posts, monitor watchlist and send confirmed signals
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          OI_PUBLIC_CHANNEL: oi_detector
        run: python -m oi_engine.telegram_runner
      - name: Save signal deduplication state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .oi_state
          key: oi-public-only-v2-${{ github.run_id }}
