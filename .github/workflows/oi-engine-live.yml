name: OI signal scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: oi-signal-scanner
  cancel-in-progress: false

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oi-signal-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore signal deduplication state
        uses: actions/cache@v4
        with:
          path: .oi_state
          key: oi-state-${{ github.run_id }}
          restore-keys: |
            oi-state-
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Scan markets and send confirmed signals
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OI_MAX_SYMBOLS: "100"
        run: python -m oi_engine.telegram_runner
