name: Public Telegram OI source tests

on:
  push:
    branches: [main]
    paths:
      - "oi_engine/telegram_public_source.py"
      - "oi_engine/alert_ingest.py"
      - "tests/test_oi_public_source.py"
      - ".github/workflows/oi-public-source-tests.yml"

jobs:
  public-source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Run OI engine, Coinalyze, Telegram and public-source tests
        run: python -m unittest discover -s tests -p 'test_oi_*.py' -v
      - name: Smoke-test public channel preview
        run: |
          python - <<'PY'
          from oi_engine.telegram_public_source import fetch_public_channel_posts
          from oi_engine.alert_ingest import parse_forwarded_oi_alert
          posts = fetch_public_channel_posts("oi_detector")
          print("Public channel posts parsed:", len(posts))
          if not posts:
              raise SystemExit("No public Telegram posts were parsed")
          matched = []
          for post in posts[-10:]:
              symbol = parse_forwarded_oi_alert({"channel_post": {"text": post["text"]}})
              print("POST", post["message_id"], "SYMBOL", symbol, "TEXT", post["text"][:240])
              if symbol:
                  matched.append(symbol)
          print("Recent OI symbols extracted:", matched)
          if not matched:
              raise SystemExit("No OI symbols extracted from the latest 10 public posts")
          PY
